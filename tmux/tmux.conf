# ========= Black & White =========== 
thm_bg="#1c1c1c"
thm_fg="#e0e0e0"

thm_red="#666666"
thm_peach="#7a7a7a"
thm_yellow="#999999"
thm_green="#858585"
thm_teal="#b5b5b5"
thm_blue="#cccccc"
thm_violet="#e0e0e0"

thm_subtext_1="#b5b5b5"
thm_subtext_0="#cccccc"
thm_overlay_1="#525252"
thm_surface_1="#383838"
thm_surface_0="#262626"
thm_mantle="#1c1c1c"
thm_crust="#141414"



set -g status "on"
set -g status-interval 1
set -g status-justify left
set -g status-style "bg=${thm_bg},fg=${thm_fg}"

set -g status-left-length 30
set -g status-left "#[fg=${thm_bg},bg=${thm_blue},bold] #S #[default] "

set -g window-status-separator " "
set -g window-status-format "#[fg=${thm_subtext_1},bg=${thm_surface_0}] #I:#W "
set -g window-status-current-format "#[fg=${thm_bg},bg=${thm_yellow},bold] #I:#W "

set -g status-right-length 100
set -g status-right "#{?client_prefix,#[fg=${thm_bg}]#[bg=${thm_red}]#[bold] PREFIX #[default] ,}#[fg=${thm_subtext_0},bg=${thm_surface_0}] #P #[fg=${thm_fg}]#{pane_current_command} #[fg=${thm_bg},bg=${thm_teal},bold] %H:%M "
set -g popup-border-style "fg=${thm_blue}"
set -g popup-border-lines "rounded"

# Pane borders
set -g pane-border-style "fg=${thm_surface_0}"
set -g pane-active-border-style "fg=${thm_blue}"
