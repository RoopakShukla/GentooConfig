# theme = "dark_plus"
theme = "neon-void"
# base16_Default
# base16_terminal / transparent
# dark_plus

[editor]
line-number = "relative"
clipboard-provider = "x-clip"
bufferline = "multiple"
cursorline = true
auto-format = false
completion-timeout = 500
color-modes = true

[editor.statusline]
left = ["mode", "read-only-indicator"]
center = ["file-base-name"]
right = ["diagnostics", "version-control", "file-type"]
separator = "│"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"
diagnostics = ["warning", "error"]
workspace-diagnostics = ["warning", "error"]

[editor.cursor-shape]
insert = "bar"

[editor.file-picker]
hidden = false

[editor.lsp]
display-inlay-hints = true
