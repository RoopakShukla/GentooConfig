set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",*:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58:2::%p1%{65536}%/%d:%p1%{256}%/%{255}%&%d:%p1%{255}%&%d'm

set -sg escape-time 10
set -g history-limit 10000
set -g mouse on
set -g set-clipboard on

unbind C-b
set -g prefix `
bind-key ` send-prefix

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind %
unbind '"'

unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Done :D"

bind-key -n 'M-t' display-popup -E -w 80% -h 80% "$SHELL"
bind-key -n 'C-n' display-popup -E "bash -i -c 'read -p \"session name: \" name; tmux new-session -d -s \"\$name\" && tmux switch-client -t \"\$name\"'"

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

bind -n M-s set-option -g status

set-window-option -g mode-keys vi
unbind -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

